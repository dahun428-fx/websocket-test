<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket 채팅</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: #222;
            background: #fafafa;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        h1 {
            font-size: 28px;
        }

        h2 {
            font-size: 18px;
        }

        .section {
            margin-bottom: 18px;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }

        .field {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
        }

        input:disabled {
            background: #f3f3f3;
        }

        button {
            min-height: 40px;
            padding: 10px 14px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-weight: 600;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status {
            margin: 12px 0 0;
            font-weight: 600;
        }

        .room-info {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 6px;
            background: #f5f5f5;
        }

        .room-info>div+div {
            margin-top: 6px;
        }

        .history-actions {
            margin-bottom: 12px;
        }

        #messages {
            height: 360px;
            margin: 0;
            padding: 12px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            list-style: none;
            background: #fff;
        }

        #messages li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            background: #f7f7f7;
            word-break: break-word;
        }

        #messages li.system {
            background: #eef3ff;
        }

        #messages li.error {
            background: #fff0f0;
        }

        #messages .message-text {
            flex: 1;
        }

        #messages .time {
            flex-shrink: 0;
            color: #777;
            font-size: 12px;
        }

        .message-form {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .message-form input {
            flex: 1;
        }

        @media (max-width: 560px) {
            body {
                padding: 16px;
            }

            .message-form {
                flex-direction: column;
            }

            .message-form button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <h1>WebSocket 채팅</h1>

    <section id="loginSection" class="section">
        <h2>로그인</h2>

        <div class="field">
            <label for="loginUserIdInput">사용자 ID</label>
            <input id="loginUserIdInput" type="text" value="user-100" placeholder="사용자 ID" />
        </div>

        <div class="field">
            <label for="passwordInput">비밀번호</label>
                <input id="passwordInput" type="password" placeholder="비밀번호" />
        </div>

        <div class="button-group">
            <button id="loginButton" type="button">로그인</button>
            <button id="logoutButton" type="button" disabled>로그아웃</button>
        </div>

        <p id="loginStatus" class="status">로그인이 필요합니다.</p>
    </section>

    <section id="roomSection" class="section">
        <h2>채팅방 입장</h2>

        <div class="field">
            <label for="roomInput">방 ID</label>
            <input id="roomInput" type="text" value="room-1" placeholder="예: room-1" disabled />
        </div>

        <button id="joinRoomButton" type="button" disabled>채팅방 입장</button>

        <div id="roomInfo" class="room-info">
            <div>
                사용자 ID:
                <strong id="currentUserId">-</strong>
            </div>
            <div>
                현재 방:
                <strong id="currentRoom">-</strong>
            </div>
            <div>
                닉네임:
                <strong id="currentNickname">-</strong>
            </div>
            <div>
                연결 수:
                <strong id="roomConnectionCount">0</strong>
            </div>
            <div>
                실제 사용자 수:
                <strong id="roomUserCount">0</strong>
            </div>
        </div>
    </section>

    <section class="section">
        <h2>채팅</h2>

        <div class="history-actions">
            <button id="loadPreviousBtn" type="button" disabled>이전 메시지 불러오기</button>
        </div>

        <ul id="messages"></ul>

        <div class="message-form">
            <input id="messageInput" type="text" maxlength="1000" placeholder="메시지를 입력하세요." disabled />
            <button id="sendBtn" type="button" disabled>전송</button>
        </div>
    </section>

    <script>
        let socket = null;

        let accessToken = null;
        let loggedInUser = null;
        let pendingRoomId = null;
        let joinedRoomId = null;

        let oldestMessageId = null;
        let hasMoreHistory = false;
        let isHistoryLoading = false;

        const loginUserIdInput = document.getElementById("loginUserIdInput");
        const passwordInput = document.getElementById("passwordInput");
        const loginButton = document.getElementById("loginButton");
        const logoutButton = document.getElementById("logoutButton");
        const loginStatus = document.getElementById("loginStatus");
        const roomInput = document.getElementById("roomInput");
        const joinRoomButton = document.getElementById("joinRoomButton");
        const roomInfo = document.getElementById("roomInfo");
        const currentUserId = document.getElementById("currentUserId");
        const currentRoom = document.getElementById("currentRoom");
        const currentNickname = document.getElementById("currentNickname");
        const roomConnectionCount = document.getElementById("roomConnectionCount");
        const roomUserCount = document.getElementById("roomUserCount");
        const loadPreviousBtn = document.getElementById("loadPreviousBtn");
        const messages = document.getElementById("messages");
        const messageInput = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");

        function formatTime(createdAt) {
            if (!createdAt) {
                return "";
            }

            const date = new Date(createdAt);

            if (Number.isNaN(date.getTime())) {
                return createdAt;
            }

            return date.toLocaleTimeString("ko-KR", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
            });
        }

        function createMessageElement(text, className = "", createdAt = null) {
            const li = document.createElement("li");

            if (className) {
                li.className = className;
            }

            const textElement = document.createElement("span");
            textElement.className = "message-text";
            textElement.textContent = text;
            li.appendChild(textElement);

            if (createdAt) {
                const timeElement = document.createElement("span");
                timeElement.className = "time";
                timeElement.textContent = formatTime(createdAt);
                li.appendChild(timeElement);
            }

            return li;
        }

        function addMessage(text, className = "", createdAt = null) {
            const li = createMessageElement(text, className, createdAt);

            messages.appendChild(li);
            messages.scrollTop = messages.scrollHeight;
        }

        function addChatMessage(chatMessage) {
            addMessage(
                `${chatMessage.nickname}: ${chatMessage.message}`,
                "",
                chatMessage.createdAt,
            );
        }

        function prependChatMessages(chatMessages) {
            if (!Array.isArray(chatMessages) || chatMessages.length === 0) {
                return;
            }

            const previousScrollHeight = messages.scrollHeight;
            const fragment = document.createDocumentFragment();

            chatMessages.forEach((chatMessage) => {
                const li = createMessageElement(
                    `${chatMessage.nickname}: ${chatMessage.message}`,
                    "",
                    chatMessage.createdAt,
                );
                fragment.appendChild(li);
            });

            messages.insertBefore(fragment, messages.firstChild);
            messages.scrollTop = messages.scrollHeight - previousScrollHeight;
        }

        function updateOldestMessageId(chatMessages) {
            if (!Array.isArray(chatMessages) || chatMessages.length === 0) {
                return;
            }

            const validIds = chatMessages
                .map((chatMessage) => chatMessage.id)
                .filter((id) => Number.isInteger(id));

            if (validIds.length === 0) {
                return;
            }

            const minimumId = Math.min(...validIds);

            if (oldestMessageId === null || minimumId < oldestMessageId) {
                oldestMessageId = minimumId;
            }
        }

        function updateRoomCounts(connectionCount, userCount) {
            if (typeof connectionCount === "number") {
                roomConnectionCount.textContent = String(connectionCount);
            }

            if (typeof userCount === "number") {
                roomUserCount.textContent = String(userCount);
            }
        }

        function resetRoomState() {
            pendingRoomId = null;
            joinedRoomId = null;
            oldestMessageId = null;
            hasMoreHistory = false;
            isHistoryLoading = false;
            roomInfo.style.display = "none";
            currentUserId.textContent = "-";
            currentRoom.textContent = "-";
            currentNickname.textContent = "-";
            updateRoomCounts(0, 0);
            messageInput.disabled = true;
            sendBtn.disabled = true;
            loadPreviousBtn.disabled = true;
        }

        async function login() {
            const userId = loginUserIdInput.value.trim();
            const password = passwordInput.value;

            if (!userId) {
                loginStatus.textContent = "사용자 ID를 입력하세요.";
                loginUserIdInput.focus();
                return;
            }

            if (!password) {
                loginStatus.textContent = "비밀번호를 입력하세요.";
                passwordInput.focus();
                return;
            }

            loginButton.disabled = true;
            loginStatus.textContent = "로그인 중입니다.";

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        userId,
                        password,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message ?? "로그인에 실패했습니다.");
                }

                accessToken = data.accessToken;
                loggedInUser = data.user;

                loginStatus.textContent =
                    `${loggedInUser.nickname}님으로 로그인했습니다.`;
                loginUserIdInput.disabled = true;
                passwordInput.disabled = true;
                roomInput.disabled = false;
                joinRoomButton.disabled = false;
                logoutButton.disabled = false;
            } catch (error) {
                accessToken = null;
                loggedInUser = null;
                loginStatus.textContent =
                    error instanceof Error
                        ? error.message
                        : "로그인에 실패했습니다.";
            } finally {
                loginButton.disabled = false;
            }
        }

        function connectWebSocket() {
            return new Promise((resolve, reject) => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    resolve(socket);
                    return;
                }

                if (socket && socket.readyState === WebSocket.CONNECTING) {
                    socket.addEventListener("open", () => resolve(socket), {
                        once: true,
                    });
                    socket.addEventListener(
                        "error",
                        () => reject(new Error("WebSocket 연결에 실패했습니다.")),
                        { once: true },
                    );
                    return;
                }

                const protocol = location.protocol === "https:" ? "wss" : "ws";
                socket = new WebSocket(`${protocol}://${location.host}`);

                socket.addEventListener("open", () => resolve(socket), {
                    once: true,
                });
                socket.addEventListener(
                    "error",
                    () => reject(new Error("WebSocket 연결에 실패했습니다.")),
                    { once: true },
                );
                socket.addEventListener("message", handleSocketMessage);
                socket.addEventListener("close", handleSocketClose);
            });
        }

        function sendJson(payload) {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                throw new Error("WebSocket이 연결되어 있지 않습니다.");
            }

            socket.send(JSON.stringify(payload));
        }

        async function joinRoom() {
            if (!accessToken || !loggedInUser) {
                addMessage("먼저 로그인하세요.", "error");
                return;
            }

            const roomId = roomInput.value.trim();

            if (!roomId) {
                addMessage("방 ID를 입력하세요.", "error");
                roomInput.focus();
                return;
            }

            joinRoomButton.disabled = true;
            pendingRoomId = roomId;

            try {
                await connectWebSocket();

                sendJson({
                    type: "register",
                    token: accessToken,
                    room_id: roomId,
                });
            } catch (error) {
                pendingRoomId = null;
                joinRoomButton.disabled = false;
                addMessage(
                    error instanceof Error
                        ? error.message
                        : "채팅방 연결에 실패했습니다.",
                    "error",
                );
            }
        }

        function handleSocketMessage(event) {
            let data;

            try {
                data = JSON.parse(event.data);
            } catch {
                addMessage("서버 메시지를 해석하지 못했습니다.", "error");
                return;
            }

            handleServerMessage(data);
        }

        function handleHistoryMessage(data) {
            const chatMessages = Array.isArray(data.messages) ? data.messages : [];

            updateOldestMessageId(chatMessages);
            hasMoreHistory = data.hasMore === true;

            if (isHistoryLoading) {
                prependChatMessages(chatMessages);
            } else {
                chatMessages.forEach(addChatMessage);
            }

            isHistoryLoading = false;
            loadPreviousBtn.disabled = !hasMoreHistory;
        }

        function handleServerError(data) {
            addMessage(data.message, "error", data.createdAt);

            if (
                data.code === "INVALID_ACCESS_TOKEN" ||
                data.code === "ACCESS_TOKEN_EXPIRED"
            ) {
                accessToken = null;
                loggedInUser = null;
                pendingRoomId = null;
                loginUserIdInput.disabled = false;
                passwordInput.disabled = false;
                loginButton.disabled = false;
                logoutButton.disabled = true;
                roomInput.disabled = true;
                joinRoomButton.disabled = true;
                loginStatus.textContent =
                    "로그인이 만료되었습니다. 다시 로그인하세요.";
                resetRoomState();
                socket?.close();
                socket = null;
                return;
            }

            if (pendingRoomId) {
                pendingRoomId = null;
                joinRoomButton.disabled = false;
            }

            if (isHistoryLoading) {
                isHistoryLoading = false;
                loadPreviousBtn.disabled = !hasMoreHistory;
            }
        }

        function handleServerMessage(data) {
            switch (data.type) {
                case "connection": {
                    addMessage(data.message, "system", data.createdAt);
                    break;
                }

                case "register-success": {
                    pendingRoomId = null;
                    joinedRoomId = data.room_id;
                    oldestMessageId = null;
                    hasMoreHistory = false;
                    isHistoryLoading = false;
                    roomInput.disabled = true;
                    joinRoomButton.disabled = true;
                    loginButton.disabled = true;
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                    loadPreviousBtn.disabled = true;
                    currentUserId.textContent = data.userId;
                    currentRoom.textContent = data.room_id;
                    currentNickname.textContent = data.nickname;
                    updateRoomCounts(data.roomConnectionCount, data.roomUserCount);
                    roomInfo.style.display = "block";
                    addMessage(data.message, "system", data.createdAt);
                    messageInput.focus();
                    break;
                }

                case "history": {
                    handleHistoryMessage(data);
                    break;
                }

                case "chat": {
                    addChatMessage(data);

                    if (oldestMessageId === null && Number.isInteger(data.id)) {
                        oldestMessageId = data.id;
                    }
                    break;
                }

                case "notification": {
                    updateRoomCounts(data.roomConnectionCount, data.roomUserCount);
                    addMessage(data.message, "system", data.createdAt);
                    break;
                }

                case "user-notification": {
                    addMessage(data.message, "system", data.createdAt);
                    break;
                }

                case "error": {
                    handleServerError(data);
                    break;
                }
            }
        }

        function handleSocketClose() {
            socket = null;
            pendingRoomId = null;
            joinedRoomId = null;
            oldestMessageId = null;
            hasMoreHistory = false;
            isHistoryLoading = false;
            updateRoomCounts(0, 0);
            messageInput.disabled = true;
            sendBtn.disabled = true;
            loadPreviousBtn.disabled = true;

            if (accessToken && loggedInUser) {
                roomInput.disabled = false;
                joinRoomButton.disabled = false;
            } else {
                roomInput.disabled = true;
                joinRoomButton.disabled = true;
            }

            addMessage("WebSocket 연결이 종료되었습니다.", "system");
        }

        function logout() {
            socket?.close();
            socket = null;
            accessToken = null;
            loggedInUser = null;
            pendingRoomId = null;
            resetRoomState();
            loginUserIdInput.disabled = false;
            passwordInput.disabled = false;
            loginButton.disabled = false;
            logoutButton.disabled = true;
            roomInput.disabled = true;
            joinRoomButton.disabled = true;
            passwordInput.value = "";
            loginStatus.textContent = "로그아웃했습니다.";
        }

        function sendChatMessage() {
            if (!joinedRoomId) {
                addMessage("먼저 채팅방에 입장하세요.", "error");
                return;
            }

            const message = messageInput.value.trim();

            if (!message) {
                addMessage("메시지를 입력하세요.", "error");
                return;
            }

            try {
                sendJson({
                    type: "chat",
                    message,
                });
                messageInput.value = "";
                messageInput.focus();
            } catch (error) {
                addMessage(
                    error instanceof Error
                        ? error.message
                        : "메시지 전송에 실패했습니다.",
                    "error",
                );
            }
        }

        function requestPreviousHistory() {
            if (!joinedRoomId) {
                addMessage("먼저 채팅방에 입장하세요.", "error");
                return;
            }

            if (oldestMessageId === null) {
                addMessage("기준이 되는 메시지가 없습니다.", "system");
                return;
            }

            if (isHistoryLoading) {
                return;
            }

            if (!hasMoreHistory) {
                addMessage("더 이상 이전 메시지가 없습니다.", "system");
                return;
            }

            isHistoryLoading = true;
            loadPreviousBtn.disabled = true;

            try {
                sendJson({
                    type: "history-request",
                    before_id: oldestMessageId,
                    limit: 30,
                });
            } catch (error) {
                isHistoryLoading = false;
                loadPreviousBtn.disabled = !hasMoreHistory;
                addMessage(
                    error instanceof Error
                        ? error.message
                        : "이전 메시지 요청에 실패했습니다.",
                    "error",
                );
            }
        }

        loginButton.addEventListener("click", () => {
            void login();
        });
        logoutButton.addEventListener("click", logout);
        joinRoomButton.addEventListener("click", () => {
            void joinRoom();
        });
        sendBtn.addEventListener("click", sendChatMessage);
        loadPreviousBtn.addEventListener("click", requestPreviousHistory);
        passwordInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                void login();
            }
        });
        roomInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                void joinRoom();
            }
        });
        messageInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.isComposing) {
                event.preventDefault();
                sendChatMessage();
            }
        });

        resetRoomState();
    </script>
</body>

</html>
