<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WebSocket 채팅방 MVP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        section {
            margin-bottom: 24px;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            padding: 10px 16px;
            border: 1px solid #888;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        button:disabled,
        input:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        #status {
            margin-bottom: 24px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-weight: 700;
        }

        #roomInfo {
            display: none;
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        #messages {
            min-height: 260px;
            max-height: 420px;
            overflow-y: auto;
            margin: 0;
            padding: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            list-style: none;
        }

        #messages li {
            margin-bottom: 12px;
            word-break: break-word;
        }

        #messages li:last-child {
            margin-bottom: 0;
        }

        .system {
            color: #666;
        }

        .error {
            color: #c00;
        }

        .time {
            margin-left: 8px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h1>WebSocket 채팅방 MVP</h1>

    <div id="status">연결되지 않음</div>

    <div id="roomInfo">
        <strong>현재 방:</strong>
        <span id="currentRoom"></span>

        <br />

        <strong>닉네임:</strong>
        <span id="currentNickname"></span>

        <br />

        <strong>현재 방 연결 수:</strong>
        <span id="roomConnectionCount">0</span>
    </div>

    <section>
        <h2>1. WebSocket 연결</h2>

        <div class="row">
            <button id="connectBtn">
                WebSocket 연결
            </button>

            <button id="disconnectBtn" disabled>
                연결 종료
            </button>
        </div>
    </section>

    <section>
        <h2>2. 닉네임 등록 및 방 입장</h2>

        <div class="row">
            <input id="nicknameInput" type="text" maxlength="20" placeholder="닉네임을 입력하세요" disabled />
        </div>

        <div class="row">
            <input id="roomInput" type="text" maxlength="20" placeholder="방 ID를 입력하세요. 예: room-1" disabled />

            <button id="registerBtn" disabled>
                방 입장
            </button>
        </div>
    </section>

    <section>
        <h2>3. 메시지 전송</h2>

        <form id="chatForm" class="row">
            <input id="messageInput" type="text" maxlength="1000" placeholder="메시지를 입력하세요" disabled />

            <button id="sendBtn" type="submit" disabled>
                전송
            </button>
        </form>
    </section>

    <h2>받은 메시지</h2>

    <ul id="messages"></ul>

    <script>
        let socket = null;
        let registeredNickname = null;
        let joinedRoomId = null;

        const statusElement =
            document.getElementById("status");

        const roomInfo =
            document.getElementById("roomInfo");

        const currentRoom =
            document.getElementById("currentRoom");

        const currentNickname =
            document.getElementById("currentNickname");

        const roomConnectionCount =
            document.getElementById(
                "roomConnectionCount",
            );

        const nicknameInput =
            document.getElementById("nicknameInput");

        const roomInput =
            document.getElementById("roomInput");

        const messageInput =
            document.getElementById("messageInput");

        const connectBtn =
            document.getElementById("connectBtn");

        const disconnectBtn =
            document.getElementById("disconnectBtn");

        const registerBtn =
            document.getElementById("registerBtn");

        const sendBtn =
            document.getElementById("sendBtn");

        const chatForm =
            document.getElementById("chatForm");

        const messages =
            document.getElementById("messages");

        function setStatus(text) {
            statusElement.textContent = text;
        }

        function formatTime(createdAt) {
            if (!createdAt) {
                return "";
            }

            const date = new Date(createdAt);

            return date.toLocaleTimeString("ko-KR", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
            });
        }

        function addMessage(
            text,
            className = "",
            createdAt = null,
        ) {
            const li = document.createElement("li");

            if (className) {
                li.className = className;
            }

            const textElement =
                document.createElement("span");

            textElement.textContent = text;

            li.appendChild(textElement);

            if (createdAt) {
                const timeElement =
                    document.createElement("span");

                timeElement.className = "time";
                timeElement.textContent =
                    formatTime(createdAt);

                li.appendChild(timeElement);
            }

            messages.appendChild(li);

            messages.scrollTop =
                messages.scrollHeight;
        }

        function updateRoomConnectionCount(count) {
            if (typeof count !== "number") {
                return;
            }

            roomConnectionCount.textContent =
                String(count);
        }

        function sendJson(payload) {
            if (!socket) {
                addMessage(
                    "WebSocket 객체가 없습니다.",
                    "error",
                );

                return false;
            }

            if (
                socket.readyState !== WebSocket.OPEN
            ) {
                addMessage(
                    "WebSocket이 연결된 상태가 아닙니다.",
                    "error",
                );

                return false;
            }

            const json = JSON.stringify(payload);

            console.log("서버로 보내는 객체:", payload);
            console.log(
                "실제로 전송되는 JSON 문자열:",
                json,
            );

            socket.send(json);

            return true;
        }

        function resetUi() {
            registeredNickname = null;
            joinedRoomId = null;

            connectBtn.disabled = false;
            disconnectBtn.disabled = true;

            nicknameInput.disabled = true;
            roomInput.disabled = true;
            registerBtn.disabled = true;

            messageInput.disabled = true;
            sendBtn.disabled = true;

            roomInfo.style.display = "none";

            currentRoom.textContent = "";
            currentNickname.textContent = "";
            roomConnectionCount.textContent = "0";

            setStatus("연결되지 않음");
        }

        connectBtn.addEventListener(
            "click",
            () => {
                if (
                    socket &&
                    (
                        socket.readyState ===
                        WebSocket.CONNECTING ||
                        socket.readyState ===
                        WebSocket.OPEN
                    )
                ) {
                    addMessage(
                        "이미 연결 중이거나 연결된 상태입니다.",
                        "error",
                    );

                    return;
                }

                setStatus("연결 중...");
                connectBtn.disabled = true;

                socket = new WebSocket(
                    "ws://localhost:3008",
                );

                socket.addEventListener(
                    "open",
                    () => {
                        console.log(
                            "WebSocket 연결 성공",
                        );

                        setStatus("서버 연결 완료");

                        connectBtn.disabled = true;
                        disconnectBtn.disabled = false;

                        nicknameInput.disabled = false;
                        roomInput.disabled = false;
                        registerBtn.disabled = false;

                        nicknameInput.focus();
                    },
                );

                socket.addEventListener(
                    "message",
                    (event) => {
                        console.log(
                            "서버에서 받은 원본 데이터:",
                            event.data,
                        );

                        let data;

                        try {
                            data = JSON.parse(event.data);
                        } catch (error) {
                            console.error(
                                "서버 응답 JSON 변환 실패:",
                                error,
                            );

                            addMessage(
                                "서버 응답을 해석할 수 없습니다.",
                                "error",
                            );

                            return;
                        }

                        console.log(
                            "객체로 변환된 데이터:",
                            data,
                        );

                        if (data.type === "connection") {
                            addMessage(
                                data.message,
                                "system",
                                data.createdAt,
                            );

                            return;
                        }

                        if (
                            data.type ===
                            "register-success"
                        ) {
                            registeredNickname =
                                data.nickname;

                            joinedRoomId =
                                data.room_id;

                            setStatus(
                                `${joinedRoomId}방에 접속 중`,
                            );

                            currentRoom.textContent =
                                joinedRoomId;

                            currentNickname.textContent =
                                registeredNickname;

                            updateRoomConnectionCount(
                                data.roomConnectionCount,
                            );

                            roomInfo.style.display =
                                "block";

                            nicknameInput.disabled = true;
                            roomInput.disabled = true;
                            registerBtn.disabled = true;

                            messageInput.disabled = false;
                            sendBtn.disabled = false;

                            addMessage(
                                data.message,
                                "system",
                                data.createdAt,
                            );

                            messageInput.focus();

                            return;
                        }

                        if (data.type === "chat") {
                            addMessage(
                                `${data.nickname}: ${data.message}`,
                                "",
                                data.createdAt,
                            );

                            return;
                        }

                        if (
                            data.type === "notification"
                        ) {
                            updateRoomConnectionCount(
                                data.roomConnectionCount,
                            );

                            addMessage(
                                data.message,
                                "system",
                                data.createdAt,
                            );

                            return;
                        }

                        if (data.type === "error") {
                            addMessage(
                                data.message,
                                "error",
                                data.createdAt,
                            );
                        }
                    },
                );

                socket.addEventListener(
                    "close",
                    () => {
                        console.log(
                            "WebSocket 연결 종료",
                        );

                        addMessage(
                            "서버와의 연결이 종료되었습니다.",
                            "system",
                        );

                        socket = null;

                        resetUi();
                    },
                );

                socket.addEventListener(
                    "error",
                    (error) => {
                        console.error(
                            "WebSocket 에러:",
                            error,
                        );

                        addMessage(
                            "WebSocket 연결 중 오류가 발생했습니다.",
                            "error",
                        );
                    },
                );
            },
        );

        disconnectBtn.addEventListener(
            "click",
            () => {
                if (!socket) {
                    return;
                }

                if (
                    socket.readyState ===
                    WebSocket.OPEN ||
                    socket.readyState ===
                    WebSocket.CONNECTING
                ) {
                    socket.close();
                }
            },
        );

        registerBtn.addEventListener(
            "click",
            () => {
                const nickname =
                    nicknameInput.value.trim();

                const roomId =
                    roomInput.value.trim();

                if (!nickname) {
                    addMessage(
                        "닉네임을 입력하세요.",
                        "error",
                    );

                    nicknameInput.focus();

                    return;
                }

                if (!roomId) {
                    addMessage(
                        "방 ID를 입력하세요.",
                        "error",
                    );

                    roomInput.focus();

                    return;
                }

                sendJson({
                    type: "register",
                    nickname,
                    room_id: roomId,
                });
            },
        );

        nicknameInput.addEventListener(
            "keydown",
            (event) => {
                if (event.key === "Enter") {
                    roomInput.focus();
                }
            },
        );

        roomInput.addEventListener(
            "keydown",
            (event) => {
                if (event.key === "Enter") {
                    registerBtn.click();
                }
            },
        );

        chatForm.addEventListener(
            "submit",
            (event) => {
                event.preventDefault();

                if (
                    !registeredNickname ||
                    !joinedRoomId
                ) {
                    addMessage(
                        "먼저 닉네임을 등록하고 방에 입장하세요.",
                        "error",
                    );

                    return;
                }

                const message =
                    messageInput.value.trim();

                if (!message) {
                    return;
                }

                const sent = sendJson({
                    type: "chat",
                    message,
                });

                if (sent) {
                    messageInput.value = "";
                    messageInput.focus();
                }
            },
        );

        resetUi();
    </script>
</body>

</html>
