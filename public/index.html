<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket 채팅</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: #222;
            background: #fafafa;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        h1 {
            font-size: 28px;
        }

        h2 {
            font-size: 18px;
        }

        .section {
            margin-bottom: 18px;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }

        .field {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
        }

        input:disabled {
            background: #f3f3f3;
        }

        button {
            min-height: 40px;
            padding: 10px 14px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-weight: 600;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status {
            margin-top: 12px;
            font-weight: 600;
        }

        .room-info {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 6px;
            background: #f5f5f5;
        }

        .room-info>div+div {
            margin-top: 6px;
        }

        .history-actions {
            margin-bottom: 12px;
        }

        #messages {
            height: 360px;
            margin: 0;
            padding: 12px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            list-style: none;
            background: #fff;
        }

        #messages li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            background: #f7f7f7;
            word-break: break-word;
        }

        #messages li.system {
            background: #eef3ff;
        }

        #messages li.error {
            background: #fff0f0;
        }

        #messages .message-text {
            flex: 1;
        }

        #messages .time {
            flex-shrink: 0;
            color: #777;
            font-size: 12px;
        }

        .message-form {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .message-form input {
            flex: 1;
        }

        @media (max-width: 560px) {
            body {
                padding: 16px;
            }

            .message-form {
                flex-direction: column;
            }

            .message-form button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <h1>WebSocket 채팅</h1>

    <section class="section">
        <h2>서버 연결</h2>

        <div class="button-group">
            <button id="connectBtn" type="button">WebSocket 연결</button>
            <button id="disconnectBtn" type="button" disabled>연결 종료</button>
        </div>

        <div id="connectionStatus" class="status">연결되지 않음</div>
    </section>

    <section class="section">
        <h2>방 입장</h2>

        <div class="field">
            <label for="userIdInput">사용자 ID</label>
            <input id="userIdInput" type="text" maxlength="50" placeholder="user-100" />
        </div>

        <div class="field">
            <label for="passwordInput">비밀번호</label>
            <input id="passwordInput" type="password" maxlength="100" placeholder="test1234" />
        </div>

        <div class="field">
            <label for="roomInput">방 ID</label>
            <input id="roomInput" type="text" maxlength="20" placeholder="room-1" />
        </div>

        <button id="registerBtn" type="button" disabled>채팅방 입장</button>

        <div id="roomInfo" class="room-info">
            <div>
                사용자 ID:
                <strong id="currentUserId">-</strong>
            </div>
            <div>
                현재 방:
                <strong id="currentRoom">-</strong>
            </div>
            <div>
                닉네임:
                <strong id="currentNickname">-</strong>
            </div>
            <div>
                연결 수:
                <strong id="roomConnectionCount">0</strong>
            </div>
            <div>
                실제 사용자 수:
                <strong id="roomUserCount">0</strong>
            </div>
        </div>
    </section>

    <section class="section">
        <h2>채팅</h2>

        <div class="history-actions">
            <button id="loadPreviousBtn" type="button" disabled>이전 메시지 불러오기</button>
        </div>

        <ul id="messages"></ul>

        <div class="message-form">
            <input id="messageInput" type="text" maxlength="1000" placeholder="메시지를 입력하세요." disabled />
            <button id="sendBtn" type="button" disabled>전송</button>
        </div>
    </section>

    <script>
        let socket = null;
        let accessToken = null;
        let registeredUserId = null;
        let registeredNickname = null;
        let joinedRoomId = null;
        let oldestMessageId = null;
        let isHistoryLoading = false;
        let hasMoreHistory = false;

        const connectionStatus = document.getElementById("connectionStatus");
        const connectBtn = document.getElementById("connectBtn");
        const disconnectBtn = document.getElementById("disconnectBtn");
        const userIdInput = document.getElementById("userIdInput");
        const passwordInput = document.getElementById("passwordInput");
        const roomInput = document.getElementById("roomInput");
        const registerBtn = document.getElementById("registerBtn");
        const roomInfo = document.getElementById("roomInfo");
        const currentUserId = document.getElementById("currentUserId");
        const currentRoom = document.getElementById("currentRoom");
        const currentNickname = document.getElementById("currentNickname");
        const roomConnectionCount = document.getElementById("roomConnectionCount");
        const roomUserCount = document.getElementById("roomUserCount");
        const loadPreviousBtn = document.getElementById("loadPreviousBtn");
        const messages = document.getElementById("messages");
        const messageInput = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");

        function createWebSocketUrl() {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            return `${protocol}//${window.location.host}`;
        }

        function setConnectionStatus(text) {
            connectionStatus.textContent = text;
        }

        function formatTime(createdAt) {
            if (!createdAt) {
                return "";
            }

            const date = new Date(createdAt);

            if (Number.isNaN(date.getTime())) {
                return createdAt;
            }

            return date.toLocaleTimeString("ko-KR", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
            });
        }

        function createMessageElement(text, className = "", createdAt = null) {
            const li = document.createElement("li");

            if (className) {
                li.className = className;
            }

            const textElement = document.createElement("span");
            textElement.className = "message-text";
            textElement.textContent = text;
            li.appendChild(textElement);

            if (createdAt) {
                const timeElement = document.createElement("span");
                timeElement.className = "time";
                timeElement.textContent = formatTime(createdAt);
                li.appendChild(timeElement);
            }

            return li;
        }

        function addMessage(text, className = "", createdAt = null) {
            const li = createMessageElement(text, className, createdAt);

            messages.appendChild(li);
            messages.scrollTop = messages.scrollHeight;
        }

        function prependChatMessages(chatMessages) {
            if (!Array.isArray(chatMessages) || chatMessages.length === 0) {
                return;
            }

            const previousScrollHeight = messages.scrollHeight;
            const fragment = document.createDocumentFragment();

            chatMessages.forEach((chatMessage) => {
                const li = createMessageElement(
                    `${chatMessage.nickname}: ${chatMessage.message}`,
                    "",
                    chatMessage.createdAt,
                );
                fragment.appendChild(li);
            });

            messages.insertBefore(fragment, messages.firstChild);
            messages.scrollTop = messages.scrollHeight - previousScrollHeight;
        }

        function updateOldestMessageId(chatMessages) {
            if (!Array.isArray(chatMessages) || chatMessages.length === 0) {
                return;
            }

            const validIds = chatMessages
                .map((chatMessage) => chatMessage.id)
                .filter((id) => Number.isInteger(id));

            if (validIds.length === 0) {
                return;
            }

            const minimumId = Math.min(...validIds);

            if (oldestMessageId === null || minimumId < oldestMessageId) {
                oldestMessageId = minimumId;
            }
        }

        function updateRoomCounts(connectionCount, userCount) {
            if (typeof connectionCount === "number") {
                roomConnectionCount.textContent = String(connectionCount);
            }

            if (typeof userCount === "number") {
                roomUserCount.textContent = String(userCount);
            }
        }

        function sendJson(payload) {
            if (!socket) {
                addMessage("WebSocket 연결이 없습니다.", "error");
                return false;
            }

            if (socket.readyState !== WebSocket.OPEN) {
                addMessage("WebSocket이 열린 상태가 아닙니다.", "error");
                return false;
            }

            socket.send(JSON.stringify(payload));
            return true;
        }

        function resetUi() {
            accessToken = null;
            registeredUserId = null;
            registeredNickname = null;
            joinedRoomId = null;
            oldestMessageId = null;
            isHistoryLoading = false;
            hasMoreHistory = false;

            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            registerBtn.disabled = true;
            userIdInput.disabled = false;
            passwordInput.disabled = false;
            roomInput.disabled = false;
            messageInput.disabled = true;
            sendBtn.disabled = true;
            loadPreviousBtn.disabled = true;
            roomInfo.style.display = "none";
            currentUserId.textContent = "-";
            currentRoom.textContent = "-";
            currentNickname.textContent = "-";
            roomConnectionCount.textContent = "0";
            roomUserCount.textContent = "0";
            setConnectionStatus("연결되지 않음");
        }

        function connectWebSocket() {
            if (
                socket &&
                (socket.readyState === WebSocket.OPEN ||
                    socket.readyState === WebSocket.CONNECTING)
            ) {
                addMessage("이미 연결 중이거나 연결된 상태입니다.", "system");
                return;
            }

            const url = createWebSocketUrl();
            socket = new WebSocket(url);
            connectBtn.disabled = true;
            setConnectionStatus("연결 중...");

            socket.addEventListener("open", () => {
                setConnectionStatus("연결됨");
                disconnectBtn.disabled = false;
                registerBtn.disabled = false;
            });

            socket.addEventListener("message", (event) => {
                handleServerMessage(event.data);
            });

            socket.addEventListener("close", (event) => {
                addMessage(
                    `WebSocket 연결이 종료되었습니다. (${event.code})`,
                    "system",
                );
                socket = null;
                resetUi();
            });

            socket.addEventListener("error", () => {
                addMessage("WebSocket 오류가 발생했습니다.", "error");
            });
        }

        async function requestAccessToken(userId, password) {
            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    userId,
                    password,
                }),
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "로그인에 실패했습니다.");
            }

            if (!data.accessToken || !data.user) {
                throw new Error("인증 토큰을 발급받지 못했습니다.");
            }

            return data;
        }

        async function registerUser() {
            const userId = userIdInput.value.trim();
            const password = passwordInput.value;
            const roomId = roomInput.value.trim();

            if (!userId) {
                addMessage("사용자 ID를 입력하세요.", "error");
                userIdInput.focus();
                return;
            }

            if (!password) {
                addMessage("비밀번호를 입력하세요.", "error");
                passwordInput.focus();
                return;
            }

            if (!roomId) {
                addMessage("방 ID를 입력하세요.", "error");
                roomInput.focus();
                return;
            }

            registerBtn.disabled = true;

            try {
                const loginResult = await requestAccessToken(userId, password);

                accessToken = loginResult.accessToken;
                registeredUserId = loginResult.user.userId;
                registeredNickname = loginResult.user.nickname;

                const isSent = sendJson({
                    type: "register",
                    token: accessToken,
                    nickname: registeredNickname,
                    room_id: roomId,
                });

                if (!isSent) {
                    registerBtn.disabled = false;
                }
            } catch (error) {
                accessToken = null;
                registeredUserId = null;
                registeredNickname = null;
                addMessage(
                    error instanceof Error ? error.message : "로그인에 실패했습니다.",
                    "error",
                );
                registerBtn.disabled = false;
            }
        }

        function sendChatMessage() {
            if (!joinedRoomId) {
                addMessage("먼저 채팅방에 입장하세요.", "error");
                return;
            }

            const message = messageInput.value.trim();

            if (!message) {
                addMessage("메시지를 입력하세요.", "error");
                return;
            }

            const isSent = sendJson({
                type: "chat",
                message,
            });

            if (isSent) {
                messageInput.value = "";
                messageInput.focus();
            }
        }

        function requestPreviousHistory() {
            if (!joinedRoomId) {
                addMessage("먼저 채팅방에 입장하세요.", "error");
                return;
            }

            if (oldestMessageId === null) {
                addMessage("기준이 되는 메시지가 없습니다.", "system");
                return;
            }

            if (isHistoryLoading) {
                return;
            }

            if (!hasMoreHistory) {
                addMessage("더 이상 이전 메시지가 없습니다.", "system");
                return;
            }

            isHistoryLoading = true;
            loadPreviousBtn.disabled = true;

            const isSent = sendJson({
                type: "history-request",
                before_id: oldestMessageId,
                limit: 30,
            });

            if (!isSent) {
                isHistoryLoading = false;
                loadPreviousBtn.disabled = !hasMoreHistory;
            }
        }

        function handleServerMessage(rawData) {
            let data;

            try {
                data = JSON.parse(rawData);
            } catch {
                addMessage("서버 응답을 해석할 수 없습니다.", "error");
                return;
            }

            if (data.type === "connection") {
                addMessage(data.message, "system", data.createdAt);
                return;
            }

            if (data.type === "register-success") {
                registeredUserId = data.userId;
                registeredNickname = data.nickname;
                joinedRoomId = data.room_id;
                oldestMessageId = null;
                isHistoryLoading = false;
                hasMoreHistory = false;

                userIdInput.disabled = true;
                passwordInput.disabled = true;
                roomInput.disabled = true;
                registerBtn.disabled = true;
                messageInput.disabled = false;
                sendBtn.disabled = false;
                loadPreviousBtn.disabled = true;
                currentUserId.textContent = registeredUserId;
                currentRoom.textContent = joinedRoomId;
                currentNickname.textContent = registeredNickname;
                updateRoomCounts(data.roomConnectionCount, data.roomUserCount);
                roomInfo.style.display = "block";
                addMessage(data.message, "system", data.createdAt);
                messageInput.focus();
                return;
            }

            if (data.type === "history") {
                const chatMessages = Array.isArray(data.messages) ? data.messages : [];

                updateOldestMessageId(chatMessages);
                hasMoreHistory = data.hasMore === true;

                if (isHistoryLoading) {
                    prependChatMessages(chatMessages);
                } else {
                    chatMessages.forEach((chatMessage) => {
                        addMessage(
                            `${chatMessage.nickname}: ${chatMessage.message}`,
                            "",
                            chatMessage.createdAt,
                        );
                    });
                }

                isHistoryLoading = false;
                loadPreviousBtn.disabled = !hasMoreHistory;
                return;
            }

            if (data.type === "chat") {
                addMessage(`${data.nickname}: ${data.message}`, "", data.createdAt);

                if (oldestMessageId === null && Number.isInteger(data.id)) {
                    oldestMessageId = data.id;
                }

                return;
            }

            if (data.type === "notification") {
                updateRoomCounts(data.roomConnectionCount, data.roomUserCount);
                addMessage(data.message, "system", data.createdAt);
                return;
            }

            if (data.type === "error") {
                const errorText = data.code
                    ? `[${data.code}] ${data.message}`
                    : data.message;

                addMessage(errorText, "error", data.createdAt);

                if (isHistoryLoading) {
                    isHistoryLoading = false;
                    loadPreviousBtn.disabled = !hasMoreHistory;
                }
            }
        }

        connectBtn.addEventListener("click", connectWebSocket);
        disconnectBtn.addEventListener("click", () => {
            if (socket) {
                socket.close(1000, "Client disconnect");
            }
        });
        registerBtn.addEventListener("click", registerUser);
        sendBtn.addEventListener("click", sendChatMessage);
        loadPreviousBtn.addEventListener("click", requestPreviousHistory);
        messageInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.isComposing) {
                event.preventDefault();
                sendChatMessage();
            }
        });
        userIdInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                passwordInput.focus();
            }
        });
        passwordInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                roomInput.focus();
            }
        });
        roomInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                registerUser();
            }
        });

        resetUi();
    </script>
</body>

</html>
